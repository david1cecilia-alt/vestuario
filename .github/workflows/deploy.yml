name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si una publicación anterior se quedó colgada en GitHub, la cancela para que no bloquee esta
      - name: Cancelar publicaciones colgadas
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/commits?per_page=8" -q '.[].sha'); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelada $sha" || true
          done
      - id: deployment
        uses: actions/deploy-pages@v4
